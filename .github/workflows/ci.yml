name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  protocol-and-host:
    name: Build + test protocol/host (no SDL3, no melonDS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build \
            -DMELONDS_REMOTE_BUILD_CLIENT=OFF \
            -DMELONDS_REMOTE_BUILD_HOST=ON \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Run integration smoke test
        run: python3 tests/smoke_test.py build/host/remote-server/melonds-remote-server

      - name: Run pairing-flow smoke test
        run: python3 tests/pairing_smoke_test.py build/host/remote-server/melonds-remote-server

  net-client-compiles:
    name: Compile client net_client.cpp/pairing_store.cpp standalone (no SDL3 available)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile net_client.cpp with strict warnings
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror \
            -I protocol/include -I client/src \
            -c client/src/net_client.cpp -o /tmp/net_client_test.o

      - name: Compile pairing_store.cpp with strict warnings
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror \
            -I client/src \
            -c client/src/pairing_store.cpp -o /tmp/pairing_store_test.o
