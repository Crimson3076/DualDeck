name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  patch-protocol-sync:
    name: Check host patches embed the current protocol version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-patch-protocol-sync.sh

  protocol-and-host:
    name: Build + test protocol/host (no SDL3, no melonDS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libturbojpeg0-dev libopenh264-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DDUALDECK_BUILD_CLIENT=OFF \
            -DDUALDECK_BUILD_HOST=ON \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Run integration smoke test
        run: python3 tests/smoke_test.py build/host/remote-server/dualdeck-host-service

      - name: Run device-approval smoke test
        run: python3 tests/device_approval_smoke_test.py build/host/remote-server/dualdeck-host-service

  host-client-menu-and-branch-selector:
    name: Host/client menu lifecycle + Installation branch selector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pure bash/python3 -- no build, no SDL3/melonDS. Both tests extract
      # the dualdeck-host.sh/dualdeck-client.sh heredocs straight out of
      # scripts/build-release.sh and run them against stub internal/
      # scripts and a fake curl fixture (no real network access), so they
      # don't need this repo's normal build dependencies either.
      - name: Run host/client menu lifecycle test
        run: python3 tests/host_client_menu_lifecycle_test.py

      - name: Run installation branch selector test
        run: python3 tests/dualdeck_branch_selector_test.py

  net-client-compiles:
    name: Compile client net_client.cpp/device_identity.cpp standalone (no SDL3 available)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libturbojpeg0-dev

      - name: Compile net_client.cpp with strict warnings
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror \
            -I protocol/include -I client/src \
            -c client/src/net_client.cpp -o /tmp/net_client_test.o

      - name: Compile device_identity.cpp with strict warnings
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror \
            -I client/src \
            -c client/src/device_identity.cpp -o /tmp/device_identity_test.o

      - name: Compile discovery_client.cpp with strict warnings
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror \
            -I protocol/include -I client/src \
            -c client/src/discovery_client.cpp -o /tmp/discovery_client_test.o

      - name: Compile discovery_store.cpp with strict warnings
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror \
            -I client/src \
            -c client/src/discovery_store.cpp -o /tmp/discovery_store_test.o
