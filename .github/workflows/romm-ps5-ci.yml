name: RomM-PS5 CI

on:
  push:
    branches: ["**"]
    paths: ["romm-ps5/**", ".github/workflows/romm-ps5-ci.yml"]
  pull_request:
    branches: ["**"]
    paths: ["romm-ps5/**", ".github/workflows/romm-ps5-ci.yml"]

jobs:
  cross-compile:
    name: Cross-compile romm-ps5.elf with the ps5-payload-dev SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ps5-payload-dev SDK
        run: |
          curl -fsSL -o ps5-payload-sdk.zip \
            https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q -d /opt ps5-payload-sdk.zip
          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> "$GITHUB_ENV"

      - name: Configure
        working-directory: romm-ps5
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE="$PS5_PAYLOAD_SDK/toolchain/prospero.cmake"

      - name: Build
        working-directory: romm-ps5
        run: cmake --build build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: romm-ps5-elf
          path: romm-ps5/build/romm-ps5.elf
