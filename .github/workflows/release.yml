name: Release (versioned build)

# Builds the patched melonDS/Azahar/Cemu hosts + SDL3 client from
# scratch and publishes them as a new, uniquely-tagged GitHub Release,
# so there's always something to grab and test without needing to build
# anything yourself. See scripts/build-release.sh for what actually gets
# built/packaged, and docs/known-limitations.md (bundled in the archive)
# for what is/isn't verified in a given build.
#
# Deliberately **manual only** (workflow_dispatch), not triggered by
# every push: this used to run automatically on every push and publish
# to a single shared "latest" tag, which meant one bad commit silently
# clobbered the only downloadable build with no way to get the previous
# one back. Now every run gets its own tag (v0.1.<run number>) and its
# own release, so nothing is ever overwritten or deleted -- older builds
# stay on the Releases page if a newer one turns out to be broken. Run
# it (Actions tab -> this workflow -> "Run workflow") at whatever points
# actually feel release-worthy, not on every commit.
#
# Takes considerably longer than the ~15-20 minutes earlier releases
# needed now that Cemu is built from source too (its vcpkg-based
# dependency graph is roughly 108 packages, on top of melonDS/Azahar/
# SDL3, none of which are packaged for this runner's Ubuntu version);
# SDL3/Azahar/Cemu are all cached across runs by pinned commit (or tag)
# and patch-file hash where applicable, so only melonDS's still-cheap
# step and this repo's own client/host rebuild from scratch every run.
# Build-time dependencies
# are NOT installed as a separate step here -- scripts/build-release.sh
# detects and installs its own (via scripts/lib/ensure-packages.sh), the
# same as it would for anyone running it locally. This also means every
# CI run is a live end-to-end test of that auto-install path on a
# genuinely clean machine.
#
# Two more caches speed up the common case of iterating on a patch (a
# bug found during end-to-end testing, not a change to the pinned
# upstream commit), where the source+build caches above are invalidated
# on every iteration since their keys include the patch file's hash:
# - sccache (mozilla-actions/sccache-action below) caches compiled
#   object files keyed on preprocessed source content, not on whether a
#   build directory happens to still be on disk -- so a patch that
#   touches a handful of files only recompiles those, even after the
#   from-scratch clone a patch-hash cache miss triggers.
# - vcpkg's own binary archive cache ($HOME/.cache/vcpkg/archives,
#   cached below keyed on the pinned Cemu commit, not the patch hash)
#   means a from-scratch Cemu clone restores its ~108 already-built
#   vcpkg package binaries instead of recompiling wxWidgets/OpenSSL/etc.
#   from source, since neither the pinned commit nor the vcpkg manifest
#   changes when only our own patch does.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build release package and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute version tag
        id: version
        run: echo "tag=v0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Installs sccache and points it at the GitHub Actions cache
      # backend automatically -- scripts/build-release.sh detects
      # sccache on PATH and passes it to every emulator/client cmake
      # configure step as CMAKE_C(XX)_COMPILER_LAUNCHER. See the header
      # comment above for why this matters far more here than in a
      # typical from-scratch CI build: most runs of this workflow are a
      # single small patch fix, not a change to a pinned upstream
      # commit.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      # vcpkg's own binary archive cache (Cemu's dependency builds only
      # -- melonDS/Azahar don't use vcpkg). See the header comment
      # above; keyed on the pinned Cemu commit, deliberately NOT on the
      # patch file's hash like the source+build cache below, since the
      # vcpkg manifest/baseline only changes when the pinned commit
      # does, never when just our own patch does.
      - name: Cache vcpkg binary archives (Cemu dependencies, independent of our patch)
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: cemu-vcpkg-archives-50b9e4ba1d4d7cf9821a9cd416378bb94e1ba0ca-${{ runner.os }}-v1

      - name: Cache SDL3 build (pinned tag, independent of this repo's commits)
        uses: actions/cache@v4
        with:
          path: .release-work/sdl3-install
          key: sdl3-release-3.2.16-${{ runner.os }}-v1

      # Azahar (Nintendo 3DS, GitHub issue #4 follow-up) is pinned to a
      # fixed commit the same way melonDS is, but its build is far
      # heavier (36 git submodules -- Vulkan, boost, dynarmic,
      # spirv-tools, etc.) -- unlike melonDS's own still-cheap-enough
      # step, this one is cached across runs the same way SDL3 is. The
      # key includes hashFiles() on our own patch file, not just the
      # pinned upstream commit: a real bug shipped two releases (v0.1.39,
      # v0.1.40) with byte-for-byte identical azahar binaries despite the
      # patch changing between them, confirmed via md5sum -- the old key
      # (pinned commit only) never changed when the patch did, so the
      # cache kept serving a stale pre-patch-change build indefinitely.
      # See scripts/build-release.sh's own cache-hit check (a real
      # `git apply --reverse --check` against the current patch content,
      # not just file existence) for the other half of this fix.
      - name: Cache Azahar build (pinned commit, independent of this repo's commits)
        uses: actions/cache@v4
        with:
          path: .release-work/azahar-src
          key: azahar-75134fca82eab4e1a86dca0aaa4a188cefff5469-${{ hashFiles('host/azahar-patches/0001-remote-server-integration.patch') }}-${{ runner.os }}-v2

      # Cemu (Nintendo Wii U) is the heaviest of the three emulator builds
      # (its own vcpkg submodule resolves to roughly 108 packages) --
      # cached the same way and for the same patch-hash-in-the-key reason
      # as Azahar's step above. This is also the very first time this
      # patch is being built at all (see host/cemu-patches/README.md's
      # "What is not verified yet" section) -- expect this step to need
      # troubleshooting on its first few runs.
      - name: Cache Cemu build (pinned commit, independent of this repo's commits)
        uses: actions/cache@v4
        with:
          path: .release-work/cemu-src
          key: cemu-50b9e4ba1d4d7cf9821a9cd416378bb94e1ba0ca-${{ hashFiles('host/cemu-patches/0001-remote-server-integration.patch') }}-${{ runner.os }}-v1

      - name: Build release package
        env:
          BUILD_RELEASE_WORKDIR: ${{ github.workspace }}/.release-work
          BUILD_RELEASE_OUTPUT_DIR: ${{ github.workspace }}/release-out
          RELEASE_VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: ./scripts/build-release.sh

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "DualDeck -- ${{ steps.version.outputs.tag }}"
          make_latest: true
          body: |
            Built from commit ${{ github.sha }} on `${{ github.ref_name }}`,
            triggered manually via workflow_dispatch.

            This release is never overwritten or deleted by a later build -- if
            this version turns out to have a problem, previous versions remain
            available on the [**Releases**](../../releases) page. See
            `RELEASE_NOTES.md` inside the archive for the exact commit it was
            built from, and `docs/known-limitations.md` (also bundled) for what
            is and isn't verified.
          files: |
            release-out/*.tar.gz
            release-out/SHA256SUMS
            release-out/DualDeck-Installer.sh
