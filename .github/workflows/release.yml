name: Release (versioned build)

# Builds the patched melonDS/Azahar/Cemu hosts + SDL3 client from
# scratch and publishes them as a new, uniquely-tagged GitHub Release,
# so there's always something to grab and test without needing to build
# anything yourself. See scripts/build-release.sh for what actually gets
# built/packaged, and docs/known-limitations.md (bundled in the archive)
# for what is/isn't verified in a given build.
#
# Deliberately **manual only** (workflow_dispatch), not triggered by
# every push: this used to run automatically on every push and publish
# to a single shared "latest" tag, which meant one bad commit silently
# clobbered the only downloadable build with no way to get the previous
# one back. Now every run gets its own tag (v0.1.<run number>) and its
# own release, so nothing is ever overwritten or deleted -- older builds
# stay on the Releases page if a newer one turns out to be broken. Run
# it (Actions tab -> this workflow -> "Run workflow") at whatever points
# actually feel release-worthy, not on every commit.
#
# Takes considerably longer than the ~15-20 minutes earlier releases
# needed now that Cemu is built from source too (its vcpkg-based
# dependency graph is roughly 108 packages, on top of melonDS/Azahar/
# SDL3, none of which are packaged for this runner's Ubuntu version);
# SDL3/Azahar/Cemu are all cached across runs by pinned commit (or tag)
# and patch-file hash where applicable, so only melonDS's still-cheap
# step and this repo's own client/host rebuild from scratch every run.
# Build-time dependencies
# are NOT installed as a separate step here -- scripts/build-release.sh
# detects and installs its own (via scripts/lib/ensure-packages.sh), the
# same as it would for anyone running it locally. This also means every
# CI run is a live end-to-end test of that auto-install path on a
# genuinely clean machine.
#
# Two more caches speed up the common case of iterating on a patch (a
# bug found during end-to-end testing, not a change to the pinned
# upstream commit), where the source+build caches above are invalidated
# on every iteration since their keys include the patch file's hash:
# - sccache (mozilla-actions/sccache-action below) caches compiled
#   object files keyed on preprocessed source content, not on whether a
#   build directory happens to still be on disk -- so a patch that
#   touches a handful of files only recompiles those, even after the
#   from-scratch clone a patch-hash cache miss triggers.
# - vcpkg's own binary archive cache ($HOME/.cache/vcpkg/archives,
#   cached below keyed on the pinned Cemu commit, not the patch hash)
#   means a from-scratch Cemu clone restores its ~108 already-built
#   vcpkg package binaries instead of recompiling wxWidgets/OpenSSL/etc.
#   from source, since neither the pinned commit nor the vcpkg manifest
#   changes when only our own patch does.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build release package and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute version tag
        id: version
        run: echo "tag=v0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Installs sccache. scripts/build-release.sh detects sccache on
      # PATH and passes it to every emulator/client cmake configure step
      # as CMAKE_C(XX)_COMPILER_LAUNCHER. See the header comment above
      # for why this matters far more here than in a typical from-
      # scratch CI build: most runs of this workflow are a single small
      # patch fix, not a change to a pinned upstream commit.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      # Real-usage bug (GitHub-reported, "why is the cache not working at
      # all?"): sccache-action's own GitHub Actions cache backend
      # (SCCACHE_GHA_ENABLED) was assumed to persist compiled objects
      # across runs, but a completed run's own `sccache --show-stats`
      # output showed `Cache location: Local disk` -- meaning sccache
      # was never actually reaching the GHA backend at all, silently
      # falling back to the runner's own ephemeral disk, which is wiped
      # at the end of every job. Confirmed by the hit-rate staying
      # essentially flat (8 hits, both on a 798-request run and again on
      # an unrelated 3138-request run) regardless of how much total work
      # a run did -- a real cross-run cache would show hits scaling with
      # reuse, not a constant tiny number. Rather than debug sccache's
      # own GHA integration further, this explicitly persists its local
      # disk cache directory via the same actions/cache mechanism this
      # workflow already relies on for vcpkg/SDL3/Azahar/Cemu, which is
      # known to actually work. Bounded to 2 GiB (SCCACHE_CACHE_SIZE
      # below, well under sccache's own 10 GiB default) since this is a
      # fifth cache sharing GitHub's 10 GB total per-repo cache budget
      # alongside those already-large source+build caches -- sccache
      # only needs to hold enough recent objects to accelerate a typical
      # small-patch iteration, not remember every historical build.
      # Uses a monotonic run-id save key with a stable restore-keys
      # prefix (the standard sccache-in-CI pattern) since actions/cache
      # can't overwrite an existing key: every run restores the most
      # recent previous cache and saves a new entry on top of it.
      - name: Cache sccache compilation objects (works across patch changes, unlike the source+build caches below)
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ runner.os }}-

      # vcpkg's own binary archive cache (Cemu's dependency builds only
      # -- melonDS/Azahar don't use vcpkg). See the header comment
      # above; keyed on the pinned Cemu commit, deliberately NOT on the
      # patch file's hash like the source+build cache below, since the
      # vcpkg manifest/baseline only changes when the pinned commit
      # does, never when just our own patch does.
      - name: Cache vcpkg binary archives (Cemu dependencies, independent of our patch)
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: cemu-vcpkg-archives-a6fb0a48eb437a8a41c13b782ac8ae0433bf8f98-${{ runner.os }}-v1

      # Real user report, 2026-08-03: the parallel Cemu cache bug below
      # (a stale cache key never bumped when the pinned commit's *build
      # invocation* changed, not the commit itself) applies here too --
      # this key was still "sdl3-release-3.2.16" after SDL3_TAG was
      # bumped to release-3.4.12 earlier this session, undetected until
      # investigating the Cemu report surfaced the same pattern. Bumped
      # to match the current tag, and scripts/build-release.sh's own
      # local cache-hit check now also verifies a marker file recording
      # which tag was actually built (see that script's own comment) --
      # a second, root-cause layer of defense so a *future* tag bump
      # that forgets to also bump this key still gets caught locally
      # rather than silently serving a stale SDL3 build again.
      - name: Cache SDL3 build (pinned tag, independent of this repo's commits)
        uses: actions/cache@v4
        with:
          path: .release-work/sdl3-install
          key: sdl3-release-3.4.12-${{ runner.os }}-v1

      # Azahar (Nintendo 3DS, GitHub issue #4 follow-up) is pinned to a
      # fixed commit the same way melonDS is, but its build is far
      # heavier (36 git submodules -- Vulkan, boost, dynarmic,
      # spirv-tools, etc.) -- unlike melonDS's own still-cheap-enough
      # step, this one is cached across runs the same way SDL3 is. The
      # key includes hashFiles() on our own patch file, not just the
      # pinned upstream commit: a real bug shipped two releases (v0.1.39,
      # v0.1.40) with byte-for-byte identical azahar binaries despite the
      # patch changing between them, confirmed via md5sum -- the old key
      # (pinned commit only) never changed when the patch did, so the
      # cache kept serving a stale pre-patch-change build indefinitely.
      # See scripts/build-release.sh's own cache-hit check (a real
      # `git apply --reverse --check` against the current patch content,
      # not just file existence) for the other half of this fix.
      - name: Cache Azahar build (pinned commit, independent of this repo's commits)
        uses: actions/cache@v4
        with:
          path: .release-work/azahar-src
          key: azahar-75134fca82eab4e1a86dca0aaa4a188cefff5469-${{ hashFiles('host/azahar-patches/0001-remote-server-integration.patch') }}-${{ runner.os }}-v2

      # Cemu (Nintendo Wii U) is the heaviest of the three emulator builds
      # (its own vcpkg submodule resolves to roughly 108 packages) --
      # cached the same way and for the same patch-hash-in-the-key reason
      # as Azahar's step above. This is also the very first time this
      # patch is being built at all (see host/cemu-patches/README.md's
      # "What is not verified yet" section) -- expect this step to need
      # troubleshooting on its first few runs.
      #
      # Real user report, 2026-08-03, "after uninstalling and
      # reinstalling, it is still using Cemu a6fb0a4, not 2.6": this key
      # is exactly the blind spot this file's own Azahar comment above
      # already names -- hashFiles() on the patch only invalidates the
      # cache when the *patch* changes, not when scripts/lib/
      # build_emulator.sh's own CMake invocation does (here:
      # -DEMULATOR_VERSION_MAJOR/-DEMULATOR_VERSION_MINOR, added to fix
      # Cemu showing its bare commit hash instead of "2.6" -- see
      # pinned_commits.sh's own comment). Neither the pinned commit nor
      # the patch file changed, so this cache kept restoring the
      # pre-fix .release-work/cemu-src (already built, patch already
      # applied) on every run since, and scripts/lib/build_emulator.sh's
      # own local cache-hit check (`git apply --reverse --check`) then
      # ALSO saw "already built, patch already applied" and skipped the
      # actual rebuild that would have picked up the new CMake flags --
      # so every release since kept shipping the identical unversioned
      # binary regardless of how many times a user reinstalled. Fixed
      # the same way Azahar's identical bug was fixed above: bump the
      # trailing version suffix to force a real cache miss and a
      # genuine rebuild.
      - name: Cache Cemu build (pinned commit, independent of this repo's commits)
        uses: actions/cache@v4
        with:
          path: .release-work/cemu-src
          key: cemu-a6fb0a48eb437a8a41c13b782ac8ae0433bf8f98-${{ hashFiles('host/cemu-patches/0001-remote-server-integration.patch') }}-${{ runner.os }}-v2

      - name: Build release package
        env:
          BUILD_RELEASE_WORKDIR: ${{ github.workspace }}/.release-work
          BUILD_RELEASE_OUTPUT_DIR: ${{ github.workspace }}/release-out
          RELEASE_VERSION_TAG: ${{ steps.version.outputs.tag }}
          # Bounds sccache's own local cache directory -- see the "Cache
          # sccache compilation objects" step's comment above for why
          # this stays well under sccache's 10 GiB default.
          SCCACHE_CACHE_SIZE: 2G
        run: ./scripts/build-release.sh

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "DualDeck -- ${{ steps.version.outputs.tag }}"
          # Point the tag at the commit that was actually built. Without
          # this, softprops creates the tag against the repository's
          # DEFAULT branch, so a release built from any other branch got
          # a tag pointing at unrelated code. That is not theoretical:
          # v0.1.144 was built from 0681bfb but its tag resolves to
          # fbc0a7e, and rebuilding "from tag v0.1.144" to recover a
          # known-good release therefore rebuilt the wrong tree
          # (2026-08-04). A tag that does not identify its own build
          # makes every rollback a guess.
          target_commitish: ${{ github.sha }}
          # Only the default branch may claim the rolling "latest" that
          # every user's "Check for updates" resolves to. Previously any
          # branch running this workflow took it: three releases built
          # from a 46-commit-stale branch became `latest` in sequence,
          # each one silently rolling users back while the version number
          # went up (2026-08-03/04). Comparing against the repo's own
          # default branch rather than a hardcoded name means this keeps
          # working if the default is ever repointed.
          make_latest: ${{ github.ref_name == github.event.repository.default_branch }}
          body: |
            Built from commit ${{ github.sha }} on `${{ github.ref_name }}`,
            triggered manually via workflow_dispatch.

            This release is never overwritten or deleted by a later build -- if
            this version turns out to have a problem, previous versions remain
            available on the [**Releases**](../../releases) page. See
            `RELEASE_NOTES.md` inside the archive for the exact commit it was
            built from, and `docs/known-limitations.md` (also bundled) for what
            is and isn't verified.
          files: |
            release-out/*.tar.gz
            release-out/*.AppImage
            release-out/SHA256SUMS
            release-out/DualDeck-Installer.sh
