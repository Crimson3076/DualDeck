name: Release (versioned build)

# Builds the patched melonDS host + SDL3 client from scratch and
# publishes them as a new, uniquely-tagged GitHub Release, so there's
# always something to grab and test without needing to build anything
# yourself. See scripts/build-release.sh for what actually gets
# built/packaged, and docs/known-limitations.md (bundled in the archive)
# for what is/isn't verified in a given build.
#
# Deliberately **manual only** (workflow_dispatch), not triggered by
# every push: this used to run automatically on every push and publish
# to a single shared "latest" tag, which meant one bad commit silently
# clobbered the only downloadable build with no way to get the previous
# one back. Now every run gets its own tag (v0.1.<run number>) and its
# own release, so nothing is ever overwritten or deleted -- older builds
# stay on the Releases page if a newer one turns out to be broken. Run
# it (Actions tab -> this workflow -> "Run workflow") at whatever points
# actually feel release-worthy, not on every commit.
#
# Takes ~15-20 minutes per run since melonDS and SDL3 are both built from
# source (neither is packaged for this runner's Ubuntu version); the
# SDL3 build is cached across runs since it's pinned to a fixed tag and
# doesn't change with this repo's own commits. Build-time dependencies
# are NOT installed as a separate step here -- scripts/build-release.sh
# detects and installs its own (via scripts/lib/ensure-packages.sh), the
# same as it would for anyone running it locally. This also means every
# CI run is a live end-to-end test of that auto-install path on a
# genuinely clean machine.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build release package and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute version tag
        id: version
        run: echo "tag=v0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Cache SDL3 build (pinned tag, independent of this repo's commits)
        uses: actions/cache@v4
        with:
          path: .release-work/sdl3-install
          key: sdl3-release-3.2.16-${{ runner.os }}-v1

      # Azahar (Nintendo 3DS, GitHub issue #4 follow-up) is pinned to a
      # fixed commit the same way melonDS is, but its build is far
      # heavier (36 git submodules -- Vulkan, boost, dynarmic,
      # spirv-tools, etc.) -- unlike melonDS's own still-cheap-enough
      # step, this one is cached across runs the same way SDL3 is. The
      # key includes hashFiles() on our own patch file, not just the
      # pinned upstream commit: a real bug shipped two releases (v0.1.39,
      # v0.1.40) with byte-for-byte identical azahar binaries despite the
      # patch changing between them, confirmed via md5sum -- the old key
      # (pinned commit only) never changed when the patch did, so the
      # cache kept serving a stale pre-patch-change build indefinitely.
      # See scripts/build-release.sh's own cache-hit check (a real
      # `git apply --reverse --check` against the current patch content,
      # not just file existence) for the other half of this fix.
      - name: Cache Azahar build (pinned commit, independent of this repo's commits)
        uses: actions/cache@v4
        with:
          path: .release-work/azahar-src
          key: azahar-75134fca82eab4e1a86dca0aaa4a188cefff5469-${{ hashFiles('host/azahar-patches/0001-remote-server-integration.patch') }}-${{ runner.os }}-v2

      - name: Build release package
        env:
          BUILD_RELEASE_WORKDIR: ${{ github.workspace }}/.release-work
          BUILD_RELEASE_OUTPUT_DIR: ${{ github.workspace }}/release-out
          RELEASE_VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: ./scripts/build-release.sh

      # melonds-remote-linux-x86_64.tar.gz is the archive's permanent,
      # never-renamed filename (see scripts/build-release.sh's
      # archive_name comment) -- every already-installed client/host's
      # apply-update.sh has that exact URL hardcoded, so it must keep
      # existing forever for auto-update to keep working across the
      # melonDS-Remote -> DualDeck rebrand. This is purely a same-bytes
      # second copy under the new name, for a tidier-looking Releases
      # page and for DualDeck-Installer.sh going forward -- not a
      # replacement.
      - name: Add DualDeck-named archive alias
        run: cp release-out/melonds-remote-linux-x86_64.tar.gz release-out/dualdeck-linux-x86_64.tar.gz

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "DualDeck -- ${{ steps.version.outputs.tag }}"
          make_latest: true
          body: |
            Built from commit ${{ github.sha }} on `${{ github.ref_name }}`,
            triggered manually via workflow_dispatch.

            This release is never overwritten or deleted by a later build -- if
            this version turns out to have a problem, previous versions remain
            available on the [**Releases**](../../releases) page. See
            `RELEASE_NOTES.md` inside the archive for the exact commit it was
            built from, and `docs/known-limitations.md` (also bundled) for what
            is and isn't verified.
          files: |
            release-out/*.tar.gz
            release-out/SHA256SUMS
            release-out/DualDeck-Installer.sh
